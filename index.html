<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>

  <link rel="stylesheet" href="./styles/LogIn.css">
  <script type="module" src="./js/login.js" defer></script>
  <script type="module" src="./js/firebase.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="./assets/favicon/logoFavicon.png">
</head>

<body>  
 
<div class="page-wrapper">

  <div class="loader-overlay" id="loader">
    <img src="./assets/LogIn&SignUp/Capa 2.svg" class="loader-logo" id="loaderLogo" alt="Join Logo">
  </div>

    <header class="page-header">
      <div class="logo">
        <img src="./assets/LogIn&SignUp/Capa 2.svg" alt="Join Logo">
      </div>
    </header>

    <main class="main-content">
      <div class="login-box">
        <h1>Log in</h1>
        <div class="underline"></div>

        <form id="loginForm" novalidate onsubmit="return false;">
          <div class="input-field">
            <input id="emailInput" type="text" inputmode="email" autocomplete="email username" placeholder="Email">
            <span class="icon">
              <img src="./assets/LogIn&SignUp/mail.svg" alt="">
            </span>
          </div>
          <div class="field-error" id="emailError"></div>

          <div class="input-field">
            <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Password">
            <span class="icon" id="passwordIcon">
              <img src="./assets/LogIn&SignUp/lock.svg" id="passwordIconImg" alt="" role="button" tabindex="0" aria-label="Toggle password visibility">
            </span>
          </div>
          <div class="field-error" id="passwordError"></div>

          <div id="loginError" class="error-message"></div>

          <div class="btn-group">
            <button class="primary-btn" id="loginBtn">Log in</button>
            <button class="outlined-btn" id="guestLoginBtn" type="button">Guest Log in</button>
          </div>
        </form>
      </div>
    </main>

    <div class="top-nav">
      <span class="LogIn-Text">Not a Join user?</span>
      <a href="./signUp.html" class="signup-btn">Sign up</a>
    </div>

    <footer>
      <a href="./privacyPolicyExt.html">Privacy Policy</a>
      <a href="./legalNoticeExt.html">Legal notice</a>
    </footer>

  </div>

  <script src="./js/loadingAnimation.js"></script>

</body>
</html>
