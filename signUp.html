<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="./styles/signup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script type="module" src="./js/userInterface.js"></script>
    <script type="module" src="./js/firebase.js"></script>
    <script type="module" src="./js/signup.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="./assets/favicon/logoFavicon.png">
</head>

<body>
  <div class="page-wrapper">
  <header class="page-header">
    <div class="logo">
      <img src="./assets/LogIn&SignUp/Capa 2.svg" alt="Join Logo">
    </div>
  </header>

  <section class="Box-position">
    <div class="login-box-signup">
      <a href="index.html" class="back-btn">
        <img src="./assets/LogIn&SignUp/arrow-left-line.svg" alt="Back">
      </a>
      <h1>Sign up</h1>
      <div class="underline"></div>
  
      <form novalidate>
        <div class="input-field">
          <input id="nameInput" type="text" autocomplete="name" placeholder="Name">
          <span class="icon"><img src="./assets/LogIn&SignUp/person.svg" alt=""></span>
        </div>
        <div class="field-error" id="nameError"></div>

        <div class="input-field">
          <input id="emailInput" type="text" inputmode="email" autocomplete="email" placeholder="Email">
          <span class="icon"><img src="./assets/LogIn&SignUp/mail.svg" alt=""></span>
        </div>
        <div class="field-error" id="emailError"></div>

        <div class="input-field">
          <input id="passwordInput" type="password" autocomplete="new-password" placeholder="Password">
          <span class="icon"><img src="./assets/LogIn&SignUp/lock.svg" alt="" role="button" tabindex="0" aria-label="Toggle password visibility"></span>
        </div>
        <div class="field-error" id="passwordError"></div>

        <div class="input-field">
          <input id="confirmInput" type="password" autocomplete="new-password" placeholder="Confirm Password">
          <span class="icon"><img src="./assets/LogIn&SignUp/lock.svg" alt="" role="button" tabindex="0" aria-label="Toggle password visibility"></span>
        </div>
        <div class="field-error" id="confirmError"></div>

        <label>
          <input type="checkbox" name="privacy" id="privacyCheck">
          I accept the <a href="./privacyPolicyExt.html">Privacy Policy</a>
        </label>
        <div class="field-error" id="privacyError"></div>

        <div id="loginError" class="error-message"></div>
  
        <div class="btn-group">
          <button class="primary-btn" id="signUpBtn" disabled>Sign up</button>
        </div>
      </form>
    </div>
  </section>

  <footer>
    <a href="./privacyPolicyExt.html">Privacy Policy</a>
    <a href="./legalNoticeExt.html">Legal notice</a>
  </footer>

  </div>
</body>

</html>
